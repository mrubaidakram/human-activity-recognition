[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "human-activity-recognition-pytorch"
version = "0.1.0"
description = "A PyTorch MLP for six-class smartphone activity recognition, using subject-separated validation and the dataset’s official test split."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.2",
]

[project.scripts]
train-human-activity-recognition-pytorch = "har_torch.train:main"

[tool.setuptools.packages.find]
where = ["src"]
